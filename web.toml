[site]
name = "Notes"
description = "A crepuscularity-powered markdown notes editor"
head_html = """
<link rel="icon" href="./static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --cp-bg { syntax: '<color>'; inherits: true; initial-value: #0c0612; }
@property --cp-fg { syntax: '<color>'; inherits: true; initial-value: #f4ebff; }
@property --cp-muted { syntax: '<color>'; inherits: true; initial-value: #9a8ab8; }
@property --cp-border { syntax: '<color>'; inherits: true; initial-value: #4c4168; }
@property --cp-elevated { syntax: '<color>'; inherits: true; initial-value: #161022; }
@property --cp-code { syntax: '<color>'; inherits: true; initial-value: #0a0610; }
@property --cp-accent { syntax: '<color>'; inherits: true; initial-value: #ffb070; }
:root {
  --cp-bg: #0c0612;
  --cp-fg: #f4ebff;
  --cp-muted: #9a8ab8;
  --cp-border: #4c4168;
  --cp-elevated: #161022;
  --cp-code: #0a0610;
  --cp-accent: #ffb070;
  --cp-accent-soft: #e8c4ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--cp-bg);color:var(--cp-fg);font-family:"Inter",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--cp-accent) 30%,transparent)}
::-webkit-scrollbar{width:0;height:0}
*{-ms-overflow-style:none;scrollbar-width:none}
.wrap{display:flex;width:100vw;height:100vh;overflow:hidden}
.sidebar{position:fixed;left:0;top:0;height:100%;width:3rem;display:flex;flex-direction:column;align-items:center;padding:0.5rem 0;background:var(--cp-elevated);border-right:1px solid var(--cp-border);z-index:1000;overflow:visible}
.sb-top{display:flex;flex-direction:column;align-items:center;width:100%;gap:0.125rem;padding:0 0.375rem}
.sb-divider{width:1.5rem;height:1px;background:var(--cp-border);margin:0.375rem 0;flex-shrink:0}
.sidebar-footer{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:0.15rem;padding-bottom:0.375rem}
.sb-stat{font-size:0.55rem;color:var(--cp-muted);font-family:"JetBrains Mono",ui-monospace,monospace;line-height:1.3;text-align:center}
.sidebar-icon{width:2.125rem;height:2.125rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:0.375rem;border:none;background:transparent;color:var(--cp-muted);cursor:pointer;transition:background 0.12s,color 0.12s;position:relative}
.sidebar-icon:hover{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%);color:var(--cp-fg)}
.sidebar-icon svg{width:1rem;height:1rem;flex-shrink:0}
.editor-area{margin-left:3rem;flex:1;height:100vh;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.editor-scroll{flex:1;overflow-y:auto;min-height:0}
.tab-bar{display:flex;align-items:stretch;flex-shrink:0;overflow:hidden;height:2.25rem;background:var(--cp-elevated);border-bottom:1px solid var(--cp-border);position:sticky;top:0;z-index:20}
.tab-list{display:flex;align-items:stretch;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{display:flex;align-items:stretch;flex-shrink:0;position:relative;max-width:180px;min-width:80px;border-right:1px solid var(--cp-border)}
.tab.active{background:var(--cp-bg)}
.tab.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--cp-accent)}
.tab-btn{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:none;background:transparent;cursor:pointer;padding:0 0.3rem 0 0.7rem;font-size:0.78rem;color:var(--cp-muted);font-family:"Inter",system-ui,sans-serif;transition:color 0.12s}
.tab.active .tab-btn{color:var(--cp-fg)}
.tab-btn:hover{color:var(--cp-fg)}
.tab-close{display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;background:transparent;cursor:pointer;width:1.5rem;color:transparent;transition:color 0.12s,background 0.12s;border-radius:0.2rem;margin:0.25rem 0.2rem;font-size:0.75rem}
.tab:hover .tab-close,.tab.active .tab-close{color:var(--cp-muted)}
.tab-close:hover{color:var(--cp-fg)!important;background:color-mix(in srgb,var(--cp-bg) 88%,white 12%)}
.tab-new{display:flex;align-items:center;justify-content:center;flex-shrink:0;border:none;background:transparent;cursor:pointer;width:2.25rem;color:var(--cp-muted);border-left:1px solid var(--cp-border);transition:color 0.12s,background 0.12s}
.tab-new:hover{color:var(--cp-fg);background:color-mix(in srgb,var(--cp-bg) 88%,white 12%)}
#editor-container{min-height:100%;max-width:48rem;margin:0 auto;padding:3rem 2rem 12rem;font-size:1rem;line-height:1.7;color:var(--cp-fg);caret-color:var(--cp-accent);outline:none;word-wrap:break-word;width:100%}
#editor-container:empty::before{content:attr(data-placeholder);color:var(--cp-muted);pointer-events:none;font-style:italic;position:absolute;top:3rem;left:2rem}
.editor-wrap{position:relative;flex:1;min-height:0;overflow-y:auto}
.editor-wrap::-webkit-scrollbar{width:0;height:0}
.class-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.editable{min-height:100%;max-width:48rem;margin:0 auto;padding:3rem 2rem 12rem;font-size:1rem;line-height:1.7;color:var(--cp-fg);caret-color:var(--cp-accent);outline:none;word-wrap:break-word;font-family:"Inter",system-ui,-apple-system,sans-serif}
.editable:empty::before{content:attr(data-placeholder);color:var(--cp-muted);pointer-events:none;font-style:italic;position:absolute;top:3rem;left:2rem}
.search-backdrop{position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.55);border:none;cursor:default}
.search-panel{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 2rem));overflow:hidden;z-index:100001;background:var(--cp-elevated);border:1px solid var(--cp-border);border-radius:0.5rem;box-shadow:0 18px 60px rgba(0,0,0,0.45),0 4px 16px rgba(0,0,0,0.3)}
.search-input{width:100%;padding:0.85rem 1rem;border:none;outline:none;background:var(--cp-elevated);color:var(--cp-fg);font-family:"Inter",system-ui,sans-serif;font-size:1rem;border-bottom:1px solid var(--cp-border)}
.search-list{max-height:min(420px,56vh);overflow-y:auto;padding:0.35rem}
.search-result-btn{width:100%;text-align:left;border:none;cursor:pointer;display:grid;gap:0.18rem;padding:0.6rem 0.7rem;border-radius:0.35rem;background:transparent;color:var(--cp-fg);font-family:"Inter",system-ui,sans-serif;font-size:0.86rem}
.search-result-btn:hover,.search-result-btn.active{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%)}
.search-result-snippet{font-size:0.74rem;color:var(--cp-muted);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-empty{padding:1rem;color:var(--cp-muted);font-size:0.82rem}
.help-panel{position:fixed;right:0;top:0;z-index:100001;width:min(390px,calc(100vw - 1rem));height:100vh;overflow:auto;background:var(--cp-elevated);border-left:1px solid var(--cp-border);box-shadow:-18px 0 52px rgba(0,0,0,0.4),-3px 0 12px rgba(0,0,0,0.2);display:flex;flex-direction:column}
.help-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1rem 1rem 0.75rem;border-bottom:1px solid var(--cp-border)}
.help-head h2{font-size:1rem;font-weight:700;line-height:1.25;color:var(--cp-fg);margin:0}
.help-close{display:flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;flex-shrink:0;border:none;border-radius:0.3rem;background:transparent;color:var(--cp-muted);cursor:pointer;font-size:1rem}
.help-close:hover{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%);color:var(--cp-fg)}
.help-grid{padding:1rem;overflow-y:auto;flex:1}
.help-section{margin-bottom:1rem}
.help-section h3{margin-bottom:0.45rem;font-size:0.76rem;font-weight:700;color:var(--cp-muted);text-transform:uppercase;letter-spacing:0.05em}
.help-section dl{display:grid;gap:0.25rem}
.help-section dl div{display:grid;grid-template-columns:minmax(4.8rem,max-content) 1fr;gap:0.65rem;align-items:baseline;min-width:0}
.help-section dt{font-size:0.7rem;color:var(--cp-accent);white-space:nowrap;font-family:"JetBrains Mono",monospace}
.help-section dd{min-width:0;font-size:0.72rem;line-height:1.35;color:var(--cp-muted)}
.sel-toolbar{position:fixed;display:flex;align-items:center;gap:1px;z-index:99999;background:var(--cp-elevated);border:1px solid var(--cp-border);border-radius:0.45rem;padding:0.25rem;box-shadow:0 4px 20px rgba(0,0,0,0.4);transform:translateX(-50%);pointer-events:auto;animation:selbar-in 0.1s ease}
@keyframes selbar-in{from{opacity:0;transform:translateX(-50%) translateY(4px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.sel-btn{display:flex;align-items:center;justify-content:center;width:2rem;height:2rem;border:none;border-radius:0.3rem;background:transparent;color:var(--cp-muted);cursor:pointer;font-size:0.85rem;transition:background 0.1s,color 0.1s}
.sel-btn:hover{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%);color:var(--cp-fg)}
.sel-divider{width:1px;height:1.2rem;background:var(--cp-border);margin:0 0.15rem;flex-shrink:0}
.sel-link-input{width:180px;padding:0.2rem 0.45rem;font-size:0.78rem;font-family:"Inter",system-ui,sans-serif;color:var(--cp-fg);background:transparent;border:none;outline:none}
.sel-confirm{color:var(--cp-accent)}
.sel-confirm:hover{background:color-mix(in srgb,var(--cp-accent) 15%,transparent)}
.slash-menu{position:fixed;overflow:hidden;z-index:99999;background:var(--cp-elevated);border:1px solid var(--cp-border);border-radius:0.5rem;width:248px;box-shadow:0 8px 32px rgba(0,0,0,0.4),0 2px 8px rgba(0,0,0,0.2)}
.slash-header{padding:0.28rem 0.75rem;font-size:0.6rem;color:var(--cp-muted);text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--cp-border)}
.slash-item{display:flex;align-items:center;width:100%;text-align:left;gap:0.6rem;padding:0.35rem 0.6rem;background:transparent;border:none;color:var(--cp-fg);font-family:"Inter",system-ui,sans-serif;cursor:pointer;transition:background 0.08s;font-size:0.82rem}
.slash-item.active,.slash-item:hover{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%)}
.slash-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:2rem;height:2rem;background:var(--cp-bg);border:1px solid var(--cp-border);border-radius:0.3rem;font-size:0.72rem;font-weight:700;color:var(--cp-muted)}
.slash-text{display:flex;flex-direction:column;gap:0.05rem}
.slash-label{font-size:0.82rem;font-weight:500;line-height:1.3}
.slash-hint{font-size:0.68rem;color:var(--cp-muted);line-height:1.3}
.code-toolbar{position:fixed;display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;z-index:9998;pointer-events:auto}
.lang-badge{display:flex;align-items:center;cursor:pointer;gap:0.3rem;padding:0.12rem 0.36rem;font-size:0.58rem;font-family:"JetBrains Mono",monospace;color:var(--cp-muted);background:var(--cp-elevated);border:1px solid var(--cp-border);border-radius:0.3rem;text-transform:uppercase;letter-spacing:0.04em}
.lang-badge:hover{color:var(--cp-fg);border-color:var(--cp-accent)}
.lang-dropdown{background:var(--cp-elevated);border:1px solid var(--cp-border);border-radius:0.4rem;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.3);width:132px;max-height:168px;overflow-y:auto}
.lang-option{display:flex;align-items:center;width:100%;text-align:left;padding:0.22rem 0.48rem;font-size:0.7rem;font-family:"Inter",system-ui,sans-serif;color:var(--cp-fg);background:transparent;border:none;cursor:pointer}
.lang-option:hover{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:0.875rem;height:0.875rem;animation:spin 1s linear infinite;color:var(--cp-accent)}
.import-input{display:none}
.popout{position:absolute;left:calc(100% + 0.5rem);top:0;z-index:9999;background:var(--cp-elevated);border:1px solid var(--cp-border);border-radius:0.5rem;padding:0.5rem;box-shadow:0 8px 32px rgba(0,0,0,0.5),0 2px 8px rgba(0,0,0,0.3)}
.popout-wrap{position:relative;width:100%;display:flex;justify-content:center;overflow:visible}
.font-popout{width:220px;padding:0.375rem;display:flex;flex-direction:column;gap:1px;max-height:min(360px,calc(100vh - 7rem))}
.font-item{display:flex;align-items:center;width:100%;text-align:left;flex-shrink:0;height:1.85rem;padding:0 0.55rem;background:transparent;border:none;border-radius:0.25rem;color:var(--cp-fg);cursor:pointer;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.font-item:hover{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%)}
.font-item.active{color:var(--cp-accent)}
.font-search{width:100%;outline:none;flex-shrink:0;padding:0.35rem 0.6rem;font-size:0.8rem;background:var(--cp-bg);border:1px solid var(--cp-border);border-radius:0.35rem;color:var(--cp-fg);font-family:"Inter",system-ui,sans-serif;margin-bottom:0.25rem}
.font-empty{padding:0.4rem 0.6rem;font-size:0.8rem;color:var(--cp-muted);font-style:italic}
.font-section-label{padding:0.3rem 0.6rem 0.1rem;font-size:0.68rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--cp-muted);pointer-events:none;-webkit-user-select:none;user-select:none}
.font-section-divider{margin:0.3rem 0.6rem;border-top:1px solid var(--cp-border)}
.note-content h1{font-size:2rem;font-weight:700;margin:1.5rem 0 0.5rem;border-bottom:1px solid var(--cp-border);padding-bottom:0.4rem;line-height:1.25}
.note-content h2{font-size:1.5rem;font-weight:700;margin:1.25rem 0 0.4rem;line-height:1.3}
.note-content h3{font-size:1.2rem;font-weight:700;margin:1rem 0 0.4rem;line-height:1.3}
.note-content p,.note-content div{margin-bottom:0.05rem;min-height:1.45em}
.note-content ul,.note-content ol{margin:0.25rem 0 0.25rem 1.5rem;padding-left:1.25rem}
.note-content ul{list-style-type:disc}
.note-content ol{list-style-type:decimal}
.note-content li{margin-bottom:0.1rem;display:list-item}
.note-content blockquote{border-left:3px solid var(--cp-accent);padding:0.25rem 0 0.25rem 1rem;margin:0.5rem 0;color:var(--cp-muted);font-style:italic}
.note-content hr{border:none;height:1px;margin:1.25rem 0;background:var(--cp-border)}
.note-content table{border-collapse:collapse;width:100%;margin:0.75rem 0}
.note-content th,.note-content td{border:1px solid var(--cp-border);padding:0.4rem 0.75rem}
.note-content th{background:color-mix(in srgb,var(--cp-bg) 88%,white 12%);font-weight:700}
.note-content a{color:var(--cp-accent);text-decoration:underline;text-underline-offset:2px}
.note-content code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:0.875em;background:var(--cp-code);padding:0.1rem 0.35rem;border-radius:0.25rem;border:1px solid var(--cp-border)}
.note-content pre{position:relative;background:var(--cp-code);border:1px solid var(--cp-border);border-radius:0.5rem;margin:0.55rem 0;overflow:hidden;padding:0.7rem 0.9rem;overflow-x:auto}
.note-content pre code{background:none;padding:0;border:none;font-size:0.875em;line-height:1.2;white-space:pre}
.note-content img{max-width:100%;border-radius:0.5rem;margin:0.5rem 0}
</style>
"""

[theme]
accent = "#ffb070"
surface = "#0c0612"
text = "#f4ebff"
muted = "#9a8ab8"
border = "#4c4168"
