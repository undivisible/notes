[package]
name = "notes-runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crepuscularity-web = { path = "/Users/undivisible/projects/crepuscularity/crates/crepuscularity-web", features = ["dom"] }
crepuscularity-core = { path = "/Users/undivisible/projects/crepuscularity/crates/crepuscularity-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "Text",
  "Storage",
  "EventTarget",
  "Event",
  "KeyboardEvent",
  "MouseEvent",
  "InputEvent",
  "CustomEvent",
  "console",
  "Blob",
  "Url",
  "Selection",
  "HtmlAnchorElement",
] }

[workspace]
